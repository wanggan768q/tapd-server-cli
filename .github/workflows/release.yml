name: release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create
      id-token: write   # npm provenance (sigstore)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag ($TAG) does not match package.json version ($PKG)"
            exit 1
          fi
          echo "VERSION=$TAG" >> "$GITHUB_ENV"

      # 硬门禁:CHANGELOG.md 顶部必须有与本次 tag 匹配的 [<version>] 段。
      # 抽取到 RELEASE_NOTES.md 给后续 gh release create 用。
      # 共享 scripts/extract-changelog.mjs 的逻辑,与本地 publish.mjs 一致。
      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          node scripts/extract-changelog.mjs "$VERSION" --out RELEASE_NOTES.md
          echo "::group::Release notes for v${VERSION}"
          cat RELEASE_NOTES.md
          echo "::endgroup::"

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Verify npm package excludes plugin files
        run: |
          set -euo pipefail
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          # npm pack --dry-run 输出每行格式形如 "npm notice 1.2kB commands/login.md"，
          # 用 [[:space:]] 锚定文件名前的空白边界，避免 ^ 锚定永远不命中（早期 PR 的坑）；
          # .claude-plugin/ 与 .mcp.json 出现在路径任意位置都算命中。
          # v0.3.0 起 commands/ 进 npm 包（user-scope commands 拷贝模板），从排除集移除。
          PATTERN='(\.claude-plugin/|[[:space:]]\.mcp\.json$|[[:space:]]skills/|[[:space:]]openspec/|[[:space:]]docs/)'
          if grep -E "$PATTERN" /tmp/pack.txt; then
            echo "::error::plugin 文件被打包进 npm 发布包，命中以下条目："
            grep -E "$PATTERN" /tmp/pack.txt | sed 's/^/::error::  /'
            exit 1
          fi
          # v0.3.0 起 commands/ 仅允许 .md（user-scope slash 命令模板）。其他扩展名
          # （.txt / .bak / .json 等）误打进包会导致 install 时拷贝出非命令文件污染
          # ~/.claude/commands/tapd-server-cli/。这条黑名单守住边界。
          COMMANDS_NON_MD='[[:space:]]commands/[^[:space:]]+\.(txt|bak|json|js|ts|tsx|jsx|map)$'
          if grep -E "$COMMANDS_NON_MD" /tmp/pack.txt; then
            echo "::error::commands/ 下出现非 .md 文件，违反 v0.3.0 约定（仅 slash 命令模板）："
            grep -E "$COMMANDS_NON_MD" /tmp/pack.txt | sed 's/^/::error::  /'
            exit 1
          fi
          echo "✓ npm package clean"

      - name: npm publish (with provenance)
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
