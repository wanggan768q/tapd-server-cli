name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # v0.3.x 起最低支持 Node 22.13（与 package.json.engines.node 一致）。
        # 同时跑 24 验证当前 Stable 行为（用户社区主流环境）。
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # npm ci 偶发拉包 ETIMEDOUT（GitHub Actions runner 网络抖动 / 镜像源
      # 路由偶尔不通），自动重试 3 次再失败。失败后才让 job 红，避免单次
      # transient flake 拖红整条 PR。
      - name: npm ci (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          command: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
