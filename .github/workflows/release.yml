name: release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create
      id-token: write   # npm provenance (sigstore)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag ($TAG) does not match package.json version ($PKG)"
            exit 1
          fi
          echo "VERSION=$TAG" >> "$GITHUB_ENV"

      # 硬门禁:CHANGELOG.md 顶部必须有与本次 tag 匹配的 [<version>] 段。
      # 抽取到 RELEASE_NOTES.md 给后续 gh release create 用。
      # 共享 scripts/extract-changelog.mjs 的逻辑,与本地 publish.mjs 一致。
      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          node scripts/extract-changelog.mjs "$VERSION" --out RELEASE_NOTES.md
          echo "::group::Release notes for v${VERSION}"
          cat RELEASE_NOTES.md
          echo "::endgroup::"

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: npm publish (with provenance)
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
