name: release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create
      id-token: write   # npm provenance (sigstore)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # v0.3.1 起最低支持 Node 22.13（与 package.json.engines.node + ci.yml 矩阵齐平）。
          # release CI 自身也跑 npm test, 跑在 Node 20 会被运行时自检 exit 2 拒绝。
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag ($TAG) does not match package.json version ($PKG)"
            exit 1
          fi
          echo "VERSION=$TAG" >> "$GITHUB_ENV"

      # 硬门禁:CHANGELOG.md 顶部必须有与本次 tag 匹配的 [<version>] 段。
      # 抽取到 RELEASE_NOTES.md 给后续 gh release create 用。
      # 共享 scripts/extract-changelog.mjs 的逻辑,与本地 publish.mjs 一致。
      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          node scripts/extract-changelog.mjs "$VERSION" --out RELEASE_NOTES.md
          echo "::group::Release notes for v${VERSION}"
          cat RELEASE_NOTES.md
          echo "::endgroup::"

      # npm ci 偶发拉包 ETIMEDOUT（GitHub Actions runner 网络抖动 / 镜像源
      # 路由偶尔不通），自动重试 3 次再失败。与 ci.yml 同款逻辑——v0.3.2
      # release CI 第 1 次跑就命中 mirrors.tencent.com ETIMEDOUT，靠 gh run
      # rerun 救回来；这条 retry 让发版路径与业务 CI 一样抗 transient flake。
      - name: npm ci (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          command: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Verify npm package excludes plugin / extra files
        run: |
          set -euo pipefail
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          # npm pack --dry-run 输出每行格式形如 "npm notice 1.2kB README.md"，
          # 用 [[:space:]] 锚定文件名前的空白边界，避免 ^ 锚定永远不命中（早期 PR 的坑）；
          # .claude-plugin/ 与 .mcp.json 出现在路径任意位置都算命中。
          # v0.3.2 起 commands/ 也回到排除集（user-scope commands 拷贝逻辑被撤回）。
          PATTERN='(\.claude-plugin/|[[:space:]]\.mcp\.json$|[[:space:]]skills/|[[:space:]]openspec/|[[:space:]]docs/|[[:space:]]commands/)'
          if grep -E "$PATTERN" /tmp/pack.txt; then
            echo "::error::禁止打包的文件被命中："
            grep -E "$PATTERN" /tmp/pack.txt | sed 's/^/::error::  /'
            exit 1
          fi
          echo "✓ npm package clean"

      - name: npm publish (with provenance)
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
